name: Daily MLB Report Generator

on:
  schedule:
    # 04:00 UTC is 12:00 PM Taipei Time (UTC+8)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch existing reports from gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages || true
          git checkout gh-pages -- reports/ || true
          git reset HEAD reports/ || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Daily Report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python fetch_mlb.py --check-wait

      - name: Commit and Push Metadata to Main
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html reports/metadata.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update report metadata for $(date +'%Y-%m-%d')" && git push origin main)

      - name: Deploy Site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true

