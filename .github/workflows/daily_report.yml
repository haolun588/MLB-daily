name: Daily MLB Report Generator

on:
  schedule:
    # 主要由外部 cron-job.org 於台北時間 13:00 以 workflow_dispatch 觸發；
    # 此 GitHub schedule（06:30 UTC = 台北 14:30，冬令美東 01:30／夏令 02:30）僅作備援，常有延遲，
    # 刻意排在主排程之後，讓主排程先跑。
    # 當日戰報已存在於 gh-pages 時，自動觸發會由 check job 跳過，避免重複產生與通知。
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
    inputs:
      date:
        description: '報表日期 YYYY-MM-DD，留空為昨日（台北時間）'
        type: string
        required: false
      notify:
        description: '是否發送 Discord 通知'
        type: boolean
        default: false
      week:
        description: '手動補產指定週的休賽季每週總整理（ISO 週 YYYY-Www，例 2026-W47）；留空則依排程規則（週一且休賽季才產生）'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if report already exists
        id: check
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          # 手動帶 date 或 week 時一律不跳過（需要能強制重產）
          if [ -n "$INPUT_DATE" ] || [ -n "$INPUT_WEEK" ]; then
            echo "手動指定 date 或 week，不檢查是否跳過"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DATE="$(TZ=Asia/Taipei date -d yesterday +%F)"
          YEAR="${DATE:0:4}"
          MONTH="${DATE:5:2}"
          if ! git fetch --depth=1 origin gh-pages; then
            echo "::warning::無法 fetch gh-pages，視為不跳過"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git cat-file -e "origin/gh-pages:reports/$YEAR/$MONTH/$DATE.html" 2>/dev/null; then
            echo "::notice::$DATE 戰報已存在於 gh-pages，跳過本次執行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  run-generator:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Resolve report date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            if ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::日期格式必須為 YYYY-MM-DD"
              exit 1
            fi
            REPORT_DATE="$INPUT_DATE"
          else
            REPORT_DATE="$(TZ=Asia/Taipei date -d yesterday +%F)"
          fi
          YEAR="${REPORT_DATE:0:4}"
          MONTH="${REPORT_DATE:5:2}"
          echo "date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "url=https://haolun588.github.io/MLB-daily/reports/$YEAR/$MONTH/$REPORT_DATE.html" >> "$GITHUB_OUTPUT"

      - name: Restore history from gh-pages
        run: |
          git fetch --depth=1 origin gh-pages
          mkdir -p site/reports site/reports/weekly site/data
          if ! git show origin/gh-pages:reports/metadata.json > site/reports/metadata.json; then
            echo "::error::無法從 gh-pages 取得 reports/metadata.json，中止以避免覆蓋歷史索引"
            exit 1
          fi
          if ! python -c "import json,sys; d=json.load(open('site/reports/metadata.json',encoding='utf-8')); sys.exit(0 if isinstance(d, dict) else 1)"; then
            echo "::error::site/reports/metadata.json 不是合法 JSON 物件，中止以避免覆蓋歷史索引"
            exit 1
          fi
          # 每日資料快照（週報來源）與週報索引：取不到只警告，不中止
          git archive origin/gh-pages data/daily | tar -x -C site || echo "::warning::gh-pages 尚無 data/daily"
          if ! git show origin/gh-pages:reports/weekly/index.json > site/reports/weekly/index.json 2>/dev/null; then
            rm -f site/reports/weekly/index.json
          fi
          # 台日韓動態追蹤名單（--watchlist 失敗時沿用上次結果）：取不到只警告，不中止
          if ! git show origin/gh-pages:data/watchlist.json > site/data/watchlist.json 2>/dev/null; then
            rm -f site/data/watchlist.json
            echo "::warning::gh-pages 尚無 data/watchlist.json"
          fi
          # RSS 累積快取（補產舊日期用的新聞與深度分析）：取不到只警告，不中止
          mkdir -p site/data
          if ! git show origin/gh-pages:data/feed_cache.json > site/data/feed_cache.json 2>/dev/null; then
            rm -f site/data/feed_cache.json
            echo "::warning::gh-pages 尚無 data/feed_cache.json"
          fi
          # 數據排行榜資料（首頁小卡來源）：取不到只警告，不中止
          mkdir -p site/data
          if ! git show origin/gh-pages:data/leaders.json > site/data/leaders.json 2>/dev/null; then
            rm -f site/data/leaders.json
            echo "::warning::gh-pages 尚無 data/leaders.json"
          fi
          # 賽季日期與當日賽季判斷快取（各步驟共用；取不到只警告，不中止）
          if ! git show origin/gh-pages:data/season_cache.json > site/data/season_cache.json 2>/dev/null; then
            rm -f site/data/season_cache.json
            echo "::warning::gh-pages 尚無 data/season_cache.json"
          fi
          # 季後賽對戰樹資料（首頁小卡來源）：取不到只警告，不中止
          if ! git show origin/gh-pages:data/playoffs.json > site/data/playoffs.json 2>/dev/null; then
            rm -f site/data/playoffs.json
            echo "::warning::gh-pages 尚無 data/playoffs.json"
          fi

      - name: Update Tracked Players Watchlist
        continue-on-error: true
        run: python fetch_mlb.py --watchlist

      - name: Update Stat Leaders
        continue-on-error: true
        run: python fetch_mlb.py --leaders

      - name: Update Postseason Bracket
        continue-on-error: true
        run: python fetch_mlb.py --playoffs

      - name: Generate Daily Report
        id: daily
        continue-on-error: true
        env:
          REPORT_DATE: ${{ steps.date.outputs.date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch_mlb.py --check-wait --no-notify --date "$REPORT_DATE"

      - name: Backfill Missed Reports
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_mlb.py --backfill

      - name: Generate Weekly Report
        id: weekly
        continue-on-error: true
        env:
          WEEK: ${{ inputs.week }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # 週報產生後會重產首頁，需要翻譯首頁人事異動
        run: |
          LOG="$RUNNER_TEMP/weekly.log"  # 放在工作目錄之外，避免被部署
          set +e
          ARGS=(--weekly)
          if [ -n "$WEEK" ]; then
            ARGS+=(--week "$WEEK")  # 即 --weekly --week "$WEEK"
          fi
          python fetch_mlb.py "${ARGS[@]}" | tee "$LOG"
          rc=${PIPESTATUS[0]}
          # 週報有產生時才輸出 weekly_week／weekly_url，供後續通知步驟使用
          grep -E '^weekly_(week|url)=' "$LOG" >> "$GITHUB_OUTPUT" || true
          exit $rc

      - name: Update Team Rosters
        continue-on-error: true
        run: python fetch_mlb.py --rosters

      - name: Stamp asset versions (cache busting)
        run: |
          python -m mlb_daily.stamp_assets site "${GITHUB_SHA::7}"

      - name: Deploy Site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      - name: Wait for GitHub Pages
        if: steps.daily.outcome == 'success'
        env:
          REPORT_URL: ${{ steps.date.outputs.url }}
        run: |
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$REPORT_URL" || true)"
            if [ "$code" = "200" ]; then
              echo "Pages 已上線：$REPORT_URL"
              exit 0
            fi
            echo "第 $i/20 次檢查：HTTP $code，15 秒後重試"
            sleep 15
          done
          echo "::warning::等待 GitHub Pages 逾時（約 5 分鐘），仍繼續後續步驟"
          exit 0

      - name: Wait for Weekly Report on GitHub Pages
        if: steps.weekly.outputs.weekly_url != '' && (github.event_name == 'schedule' || inputs.notify == true)
        env:
          WEEKLY_URL: ${{ steps.weekly.outputs.weekly_url }}
        run: |
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$WEEKLY_URL" || true)"
            if [ "$code" = "200" ]; then
              echo "Pages 已上線：$WEEKLY_URL"
              exit 0
            fi
            echo "第 $i/20 次檢查：HTTP $code，15 秒後重試"
            sleep 15
          done
          echo "::warning::等待週報 GitHub Pages 逾時（約 5 分鐘），仍繼續後續步驟"
          exit 0

      - name: Send Discord Notification
        if: steps.daily.outcome == 'success' && (github.event_name == 'schedule' || inputs.notify == true)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_DATE: ${{ steps.date.outputs.date }}
        run: |
          python fetch_mlb.py --notify-only --date "$REPORT_DATE"

      - name: Send Weekly Discord Notification
        if: steps.weekly.outputs.weekly_url != '' && (github.event_name == 'schedule' || inputs.notify == true)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEEKLY_WEEK: ${{ steps.weekly.outputs.weekly_week }}
        run: |
          python fetch_mlb.py --notify-weekly --week "$WEEKLY_WEEK"

      - name: Fail if daily report failed
        if: steps.daily.outcome == 'failure'
        run: |
          echo "::error::每日戰報產生失敗（部署與週報已照常進行）"
          exit 1
